<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Neytreya Observation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 320px; height: 90px;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .bubble {
      position: absolute; inset: 0;
      margin: 6px;
      background: rgba(8, 12, 9, 0.92);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px 0 10px;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.6),
        0 0 0 0.5px rgba(255,255,255,0.04) inset,
        0 0 16px rgba(16,185,129,0.08);

      opacity: 0;
      transform: translateY(-8px) scale(0.96);
      transition: opacity 320ms cubic-bezier(0.16,1,0.3,1),
                  transform 320ms cubic-bezier(0.34,1.56,0.64,1);
    }
    .bubble.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .bubble.hidden {
      opacity: 0;
      transform: translateY(-6px) scale(0.97);
    }

    /* CSS Eye indicator */
    .eye-wrap {
      flex-shrink: 0;
      width: 32px; height: 32px;
      border-radius: 9px;
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.2);
      display: flex; align-items: center; justify-content: center;
    }
    .eye-svg { width: 20px; height: 20px; }

    /* Text */
    .bubble-body { flex: 1; min-width: 0; }
    .bubble-label {
      font-family: -apple-system, 'Inter', sans-serif;
      font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(16,185,129,0.8);
      margin-bottom: 2px;
    }
    .bubble-text {
      font-family: -apple-system, 'Inter', sans-serif;
      font-size: 12px; font-weight: 500; line-height: 1.35;
      color: rgba(255,255,255,0.9);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* Dismiss button */
    .dismiss {
      flex-shrink: 0;
      width: 20px; height: 20px;
      border-radius: 50%; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.35);
      font-size: 13px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 150ms ease;
    }
    .dismiss:hover { background: rgba(248,113,113,0.15); border-color: rgba(248,113,113,0.3); color: #f87171; }

    /* Progress bar at bottom */
    .progress {
      position: absolute;
      bottom: 6px; left: 10px; right: 10px; height: 2px;
      background: rgba(16,185,129,0.12);
      border-radius: 1px; overflow: hidden;
    }
    .progress-bar {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, rgba(16,185,129,0.8), rgba(52,211,153,0.5));
      border-radius: 1px;
      transform-origin: left;
      transform: scaleX(1);
      transition: transform 7s linear;
    }
    .progress-bar.countdown { transform: scaleX(0); }
  </style>
</head>
<body>
  <div class="bubble" id="bubble">
    <div class="eye-wrap">
      <svg class="eye-svg" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 5C6.5 5 3 10 3 10C3 10 6.5 15 10 15C13.5 15 17 10 17 10C17 10 13.5 5 10 5Z"
          stroke="#10b981" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="10" cy="10" r="3" stroke="#10b981" stroke-width="1.4"/>
        <circle cx="10" cy="10" r="1.2" fill="#10b981"/>
      </svg>
    </div>

    <div class="bubble-body">
      <div class="bubble-label" id="bubble-label">Neytreya noticed</div>
      <div class="bubble-text" id="bubble-text">Observing your screen…</div>
    </div>

    <button class="dismiss" id="dismiss-btn" title="Dismiss">&#10005;</button>

    <div class="progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <script>
    const bubble  = document.getElementById('bubble');
    const textEl  = document.getElementById('bubble-text');
    const labelEl = document.getElementById('bubble-label');
    const bar     = document.getElementById('progress-bar');

    document.getElementById('dismiss-btn').addEventListener('click', () => {
      window.neytreya.dismissBubble();
    });

    window.addEventListener('message', handleMsg);

    function show(obs) {
      textEl.innerText  = obs.text  || obs.message || 'Something detected.';
      labelEl.innerText = obs.app   ? `Neytreya — ${obs.app}` : 'Neytreya noticed';
      bubble.classList.remove('hidden');
      requestAnimationFrame(() => {
        bubble.classList.add('visible');
        // Start countdown bar
        bar.classList.remove('countdown');
        void bar.offsetWidth; // force reflow
        bar.classList.add('countdown');
      });
    }

    function hide() {
      bubble.classList.add('hidden');
      bubble.classList.remove('visible');
    }

    // IPC via preload
    if (window.neytreya?.onShowObservation) {
      window.neytreya.onShowObservation(show);
      window.neytreya.onDismissObservation(hide);
    }
  </script>
</body>
</html>
