<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gallery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #060e09; color: #fff; margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h2 { margin: 0; }
    .close-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .date-filter { background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 6px; outline: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .grid-item { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: transform 0.2s; }
    .grid-item:hover { transform: scale(1.02); border-color: rgba(255,255,255,0.4); }
    .grid-item img { width: 100%; height: 140px; object-fit: cover; display: block; }
    .grid-time { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
    .delete-btn { position: absolute; top: 8px; right: 8px; background: rgba(220,38,38,0.8); border: none; color: white; border-radius: 4px; width: 24px; height: 24px; cursor: pointer; display: none; }
    .grid-item:hover .delete-btn { display: block; }
    .empty { padding: 40px; text-align: center; color: rgba(255,255,255,0.5); grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="header" style="-webkit-app-region: drag;">
    <h2>Visual Timeline</h2>
    <div style="-webkit-app-region: no-drag; display: flex; gap: 12px; align-items: center;">
      <select id="date-picker" class="date-filter">
        <option value="all">All Dates</option>
      </select>
      <button class="close-btn" onclick="window.close()">Close</button>
    </div>
  </div>
  <div class="grid" id="grid">
    <div class="empty">Loading...</div>
  </div>
  <script>
    const grid = document.getElementById('grid');
    const datePicker = document.getElementById('date-picker');
    
    // Add today option
    const today = new Date().toISOString().split('T')[0];
    const option = document.createElement('option');
    option.value = today;
    option.textContent = 'Today (' + today + ')';
    datePicker.appendChild(option);
    
    datePicker.value = 'all';

    function esc(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function loadGallery(date) {
      grid.innerHTML = '<div class="empty">Loading...</div>';
      try {
        const res = await fetch('http://127.0.0.1:7432/recall/active-timeline?date=' + encodeURIComponent(date));
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        
        if (!data.snapshots || data.snapshots.length === 0) {
          grid.innerHTML = '<div class="empty">No screenshots recorded for this date.</div>';
          return;
        }

        grid.innerHTML = data.snapshots.reverse().map(snap => {
          const baseName = snap.filename.split('/').pop();
          return `
            <div class="grid-item">
              <img src="http://127.0.0.1:7432/recall/snapshot/${encodeURIComponent(baseName)}" onclick="window.neytreya.openSnapshot('${baseName}')" />
              <div class="grid-time">${esc(snap.time || '')}</div>
              <button class="delete-btn" onclick="deleteSnapshot(event, '${baseName}')">🗑</button>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<div class="empty">Error loading screenshots. Is the backend running?</div>';
      }
    }

    async function deleteSnapshot(e, baseName) {
      e.stopPropagation();
      if (!confirm('Delete this screenshot?')) return;
      try {
        await fetch('http://127.0.0.1:7432/recall/snapshot/' + encodeURIComponent(baseName), { method: 'DELETE' });
        loadGallery(datePicker.value);
      } catch(err) {
        alert('Failed to delete');
      }
    }

    datePicker.addEventListener('change', (e) => {
      loadGallery(e.target.value);
    });

    loadGallery('all');
  </script>
</body>
</html>
